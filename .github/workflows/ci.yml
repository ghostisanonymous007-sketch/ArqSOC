name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test-kali:
    runs-on: ubuntu-latest
    container:
      image: kalilinux/kali-rolling
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-venv libyara-dev gcc
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -e ".[dev]"
      - name: Run tests
        run: pytest --tb=short -q

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --tb=short -q
