[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arqsoc"
version = "1.0.0"
description = "Full-featured SOC analysis terminal toolkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "ArqSOC Contributors" },
]
keywords = ["soc", "security-operations", "malware-analysis", "ioc", "incident-response", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "capstone>=5.0.0",
    "lief>=0.12.0",
    "yara-python>=4.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
fuzzy = ["ssdeep>=3.4"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
arqsoc = "arqsoc.cli:app"

[tool.setuptools.packages.find]
include = ["arqsoc*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
